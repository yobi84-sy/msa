name: deploy order order-backend

on:
  push:
    # Branches Name Change
    branches:
      - yobi-v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # GitHub가 제공하는 Ubuntu 가상머신에서 실행

    # GitHub OIDC 인증 권한
    permissions:
      id-token: write
      contents: read

    steps:
      # GitHub 코드 체크아웃
      - name: checkout github
        # actions/checkout@v4
        # 현재 GitHub 저장소 코드를 runner(ubuntu 서버)에 내려받는 공식 액션
        # 이 단계 없으면 docker build할 소스 코드가 없음
        uses: actions/checkout@v4


      # kubectl 설치
      - name: install kubectl
        # azure/setup-kubectl@v3
        # GitHub runner에 kubectl CLI를 설치해주는 액션
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.35.0"


      # GitHub OIDC → AWS IAM Role 임시 인증
      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::021158485482:role/sales-mall-dev-github-actions-role
          aws-region: ap-northeast-2


      # EKS 클러스터 접속 설정
      - name: update cluster information
      # 생성 된 클러스 이름 확인 필요.
        run: aws eks update-kubeconfig --name sales-mall-dev-eks --region ap-northeast-2
        # kubectl이 EKS 클러스터에 접속할 수 있도록 kubeconfig 생성


      # ECR 로그인
      - name: Login to ECR
        # aws-actions/amazon-ecr-login@v2
        # → Docker가 AWS ECR에 push할 수 있도록 로그인 처리
        uses: aws-actions/amazon-ecr-login@v2


      # 변경된 폴더 감지
      - name: detect changed services
        id: changes

        # dorny/paths-filter@v3
        # push에서 변경된 파일 목록을 분석 지정한 경로에 변경이 있으면 true/false 자동 생성
        # changes.outputs.member 같은 값으로 접근 가능
        uses: dorny/paths-filter@v3

        with:
          filters: |
            gateway:
              - 'msa/apigateway/**'
            member:
              - 'msa/member/**'
            ordering:
              - 'msa/ordering/**'
            product:
              - 'msa/product/**'
            frontend:
              - 'msa/frontend/**'  

      # 변경 없으면 종료
      - name: stop if no service changed
        # 모든 서비스가 false일 경우 실행
        # 불필요한 docker build 방지
        if: |
          steps.changes.outputs.gateway != 'true' &&
          steps.changes.outputs.member != 'true' &&
          steps.changes.outputs.ordering != 'true' &&
          steps.changes.outputs.product != 'true' &&
           steps.changes.outputs.frontend != 'true'
        run: |
          echo "No service directory changed. Skip build & deploy."
          exit 0


      # Gateway 빌드
      - name: gateway build and push docker image to ecr
        if: steps.changes.outputs.gateway == 'true'
        env:         
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-apigateway
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/apigateway/Dockerfile ./msa/apigateway
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: deploy gateway
        if: steps.changes.outputs.gateway == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-apigateway
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E "s#(^[[:space:]]*image: ).*#\1${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}#" \
            ./msa/apigateway/k8s/depl_svc.yml | kubectl apply -f -

          kubectl rollout status deployment/apigateway-depl -n soldesk --timeout=300s


      # Member 빌드
      - name: member build and push docker image to ecr
        if: steps.changes.outputs.member == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-member
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/member/Dockerfile ./msa/member
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: deploy member
        if: steps.changes.outputs.member == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-member
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E "s#(^[[:space:]]*image: ).*#\1${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}#" \
            ./msa/member/k8s/depl_svc.yml | kubectl apply -f -

          kubectl rollout status deployment/member-depl -n soldesk --timeout=300s


      # Ordering 빌드
      - name: order build and push docker image to ecr
        if: steps.changes.outputs.ordering == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-ordering
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/ordering/Dockerfile ./msa/ordering
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: deploy ordering
        if: steps.changes.outputs.ordering == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-ordering
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E "s#(^[[:space:]]*image: ).*#\1${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}#" \
            ./msa/ordering/k8s/depl_svc.yml | kubectl apply -f -

          kubectl rollout status deployment/ordering-depl -n soldesk --timeout=300s


      # Product 빌드
      - name: product build and push docker image to ecr
        if: steps.changes.outputs.product == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-product
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/product/Dockerfile ./msa/product
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: deploy product
        if: steps.changes.outputs.product == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-product
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E "s#(^[[:space:]]*image: ).*#\1${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}#" \
            ./msa/product/k8s/depl_svc.yml | kubectl apply -f -

          kubectl rollout status deployment/product-depl -n soldesk --timeout=300s


      # Frontend 빌드
      - name: frontend build and push docker image to ecr
        if: steps.changes.outputs.frontend == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-frontend
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -f ./msa/frontend/Dockerfile ./msa/frontend
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        env:
          REGISTRY: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com
          REPOSITORY: sales-mall-dev-frontend
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E "s#(^[[:space:]]*image: ).*#\1${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}#" \
            ./msa/frontend/k8s/depl_svc.yml | kubectl apply -f -

          kubectl rollout status deployment/frontend-depl -n soldesk --timeout=300s