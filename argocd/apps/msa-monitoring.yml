# [Monitoring owner] Grafana, Prometheus, node-exporter, certificate
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yobi84-sy/msa.git
    targetRevision: yobi-v1
    path: msa/k8s/k8s-monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Large dashboards cannot fit in the client-side last-applied annotation.
    - DisableClientSideApplyMigration=true
