# [ArgoCD App-of-Apps] manages exactly MSA and monitoring (no Terraform-owned resources)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: msa-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yobi84-sy/msa.git
    targetRevision: yobi-v1
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
