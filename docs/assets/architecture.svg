<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#80b8ca" stroke-width="1.5"/></marker></defs><g font-family="Malgun Gothic, Segoe UI, sans-serif"><rect x="0" y="0" width="1240" height="810" rx="0" fill="#0d1c2b" stroke="#0d1c2b"/><text x="32" y="43" font-size="25" fill="#e7f5ff" font-weight="700">AWS MSA · SERVICE OPERATIONS</text><text x="32" y="70" font-size="16" fill="#8eacc4" font-weight="400">기반은 Terraform, 앱 상태는 GitOps, 결과는 사용자 동작으로 확인합니다.</text><rect x="28" y="95" width="1184" height="111" rx="13" fill="#132536" stroke="#30465b"/><text x="44" y="119" font-size="12" fill="#8cddd0" font-weight="650">BUILD &amp; DELIVERY</text><rect x="47" y="132" width="218" height="55" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="47" y="132" width="4" height="55" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="64" y="161" font-size="20" fill="#eef7ff" font-weight="650">GitHub · yobi-v1</text><rect x="327" y="132" width="217" height="55" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="327" y="132" width="4" height="55" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="344" y="161" font-size="20" fill="#eef7ff" font-weight="650">Actions · test/build</text><rect x="607" y="132" width="217" height="55" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="607" y="132" width="4" height="55" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="624" y="161" font-size="20" fill="#eef7ff" font-weight="650">ECR · images</text><rect x="887" y="132" width="290" height="55" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="887" y="132" width="4" height="55" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="904" y="161" font-size="20" fill="#eef7ff" font-weight="650">Argo CD · GitOps sync</text><path d="M268 159 L321 159" fill="none" stroke="#b5a3f2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M548 159 L601 159" fill="none" stroke="#b5a3f2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="841" y="156" font-size="17" fill="#7c93ac" font-weight="400">+</text><text x="46" y="227" font-size="14" fill="#8ba8bf" font-weight="400">Actions는 이미지 게시와 GitOps 태그 갱신을 수행하고, Argo CD는 Git의 배포 선언을 읽습니다.</text><rect x="211" y="244" width="1000" height="376" rx="13" fill="#102435" stroke="#477469"/><text x="228" y="269" font-size="17" fill="#8dd5c0" font-weight="650">VPC 10.0.0.0/16 · SEOUL · 두 AZ</text><rect x="232" y="290" width="209" height="239" rx="13" fill="#302b191c" stroke="#7b6941"/><text x="247" y="316" font-size="13" fill="#cdb17d" font-weight="600">PUBLIC SUBNETS</text><rect x="461" y="290" width="732" height="294" rx="13" fill="#142e4430" stroke="#3d6687"/><text x="480" y="316" font-size="13" fill="#9bc6e5" font-weight="600">PRIVATE SUBNETS · EKS 워커 + RDS</text><rect x="28" y="294" width="156" height="67" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="28" y="294" width="4" height="67" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="45" y="323" font-size="20" fill="#eef7ff" font-weight="650">Route 53</text><text x="45" y="347" font-size="14" fill="#9ebacf" font-weight="400">DNS 주소 조회</text><rect x="28" y="399" width="156" height="77" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="28" y="399" width="4" height="77" rx="2" fill="#83d4c2" stroke="#83d4c2"/><text x="45" y="428" font-size="20" fill="#eef7ff" font-weight="650">브라우저</text><text x="45" y="452" font-size="14" fill="#9ebacf" font-weight="400">HTTPS / 443</text><path d="M103 395 L103 365" fill="none" stroke="#a99ad5" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="248" y="398" width="177" height="78" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="248" y="398" width="4" height="78" rx="2" fill="#b5a3f2" stroke="#b5a3f2"/><text x="265" y="427" font-size="20" fill="#eef7ff" font-weight="650">NLB</text><text x="265" y="451" font-size="14" fill="#9ebacf" font-weight="400">공유 외부 진입점</text><rect x="478" y="348" width="501" height="184" rx="13" fill="#0c2030" stroke="#336e70"/><text x="491" y="373" font-size="13" fill="#77baae" font-weight="600">EKS · Kubernetes services / pods</text><rect x="491" y="400" width="185" height="91" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="491" y="400" width="4" height="91" rx="2" fill="#83d4c2" stroke="#83d4c2"/><text x="508" y="429" font-size="20" fill="#eef7ff" font-weight="650">NGINX Ingress</text><text x="508" y="453" font-size="14" fill="#9ebacf" font-weight="400">TLS 종료</text><text x="508" y="473" font-size="14" fill="#9ebacf" font-weight="400">cert-manager Secret</text><rect x="727" y="391" width="235" height="112" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="727" y="391" width="4" height="112" rx="2" fill="#80b8f2" stroke="#80b8f2"/><text x="744" y="420" font-size="20" fill="#eef7ff" font-weight="650">애플리케이션</text><text x="744" y="444" font-size="14" fill="#9ebacf" font-weight="400">Frontend · API Gateway</text><text x="744" y="464" font-size="14" fill="#9ebacf" font-weight="400">Member · Product · Ordering</text><rect x="1003" y="401" width="174" height="91" rx="13" fill="#162b3e" stroke="#36546c"/><rect x="1003" y="401" width="4" height="91" rx="2" fill="#ce9feb" stroke="#ce9feb"/><text x="1020" y="430" font-size="20" fill="#eef7ff" font-weight="650">RDS MySQL</text><text x="1020" y="454" font-size="14" fill="#9ebacf" font-weight="400">Single-AZ · 20 GiB</text><text x="1020" y="474" font-size="14" fill="#9ebacf" font-weight="400">Private / 3306</text><path d="M186 435 L242 435" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M429 435 L485 435" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M680 435 L721 435" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M965 435 L997 435" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="189" y="422" font-size="11" fill="#8cacc0" font-weight="400">HTTPS</text><text x="437" y="422" font-size="11" fill="#8cacc0" font-weight="400">TCP</text><text x="682" y="422" font-size="11" fill="#8cacc0" font-weight="400">HTTP</text><text x="969" y="422" font-size="11" fill="#8cacc0" font-weight="400">SQL</text><text x="249" y="557" font-size="18" fill="#e2c493" font-weight="600">NAT 1개</text><text x="249" y="580" font-size="13" fill="#b8a783" font-weight="400">Private → 외부 통신</text><text x="479" y="559" font-size="16" fill="#96b7cf" font-weight="400">노드: t3.medium · desired 3 / min 2 / max 6</text><text x="230" y="605" font-size="13" fill="#7c9baf" font-weight="400">웹 진입은 ALB가 아닌 NLB입니다. Spring Cloud Gateway는 클러스터 안의 앱입니다.</text><rect x="28" y="642" width="574" height="137" rx="13" fill="#142535" stroke="#344d61"/><text x="44" y="669" font-size="16" fill="#a8c1d5" font-weight="650">상품 이미지 · 별도 전달 경로</text><text x="45" y="702" font-size="17" fill="#d8e6f2" font-weight="600">브라우저</text><path d="M128 696 L169 696" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="183" y="702" font-size="18" fill="#cbb6ed" font-weight="600">CloudFront</text><path d="M292 696 L334 696" fill="none" stroke="#78b9e9" stroke-width="2.5" marker-end="url(#arrow)"/><text x="349" y="702" font-size="18" fill="#b8d68f" font-weight="600">비공개 S3</text><text x="45" y="739" font-size="14" fill="#829fb7" font-weight="400">원본 접근: OAC · 웹/API 전체 CDN 구성은 아님</text><rect x="623" y="642" width="589" height="137" rx="13" fill="#142535" stroke="#344d61"/><text x="639" y="669" font-size="16" fill="#a8c1d5" font-weight="650">운영·주문 알림</text><text x="639" y="704" font-size="17" fill="#cae3eb" font-weight="600">지표 → Prometheus / CloudWatch → SNS</text><text x="639" y="733" font-size="16" fill="#94d6bf" font-weight="600">주문 → DB Outbox → SNS → 이메일 / SMS</text><text x="639" y="758" font-size="12" fill="#829fb7" font-weight="400">Grafana: 시각화 · SQS 미구현 · SMS는 검증 조건 적용</text></g></svg>