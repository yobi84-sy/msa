<text x="64" y="375" fill="#c2d4e4" font-size="17" font-weight="400">Private + Public API endpoint</text>
<text x="64" y="400" fill="#c2d4e4" font-size="17" font-weight="400">워커 서브넷 안의 Pod가 아닌 관리 서비스</text>
