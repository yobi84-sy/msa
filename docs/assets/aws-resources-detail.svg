<text x="608" y="375" fill="#c2d4e4" font-size="17" font-weight="400">Cluster / Node / GitHub 역할 + IRSA</text>
<text x="608" y="400" fill="#c2d4e4" font-size="17" font-weight="400">IAM은 계정 전역 · S3 / DNS / SNS 권한 분리</text>
