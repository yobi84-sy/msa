<text x="1188" y="1156" fill="#c2d4e4" font-size="18" font-weight="400">EventBridge → Lambda HTTP 접속 검사</text>
<text x="1188" y="1189" fill="#c2d4e4" font-size="18" font-weight="400">주문 + DB Outbox → SNS 이메일 / SMS</text>
<text x="1188" y="1222" fill="#c2d4e4" font-size="18" font-weight="400">Ordering: IRSA + 채널별 발송·재시도</text>
<text x="1188" y="1255" fill="#c2d4e4" font-size="18" font-weight="400">Prometheus 규칙 → 알림 연계</text>
<text x="1188" y="1288" fill="#c2d4e4" font-size="18" font-weight="400">SQS / DLQ는 현재 미구현</text>
<rect x="46" y="1370" width="1704" height="51" rx="16" fill="#152c3f" stroke="#355267" />
<text x="64" y="1402" fill="#c2d4e4" font-size="18" font-weight="400">실선: 주요 요청 흐름  ·  점선 상자: 추가 패키지 범위  ·  AWS 서비스의 세부 종속 리소스는 연결 문서의 표 참조</text>
<text x="40" y="1485" fill="#eef7ff" font-size="23" font-weight="650">생성 주체를 구분해서 읽기</text>
<text x="40" y="1521" fill="#c2d4e4" font-size="19" font-weight="400">Terraform: VPC / EKS / IAM / RDS / S3 / ECR / Helm 등  →  Controller: NLB / EC2·ASG  →  Argo CD: 앱·관측 리소스</text>
<text x="40" y="1559" fill="#a9bdcd" font-size="18" font-weight="400">2개 AZ가 모든 계층의 이중화를 뜻하지 않음 · NAT 1개 / RDS Single-AZ · 배치 범위와 한계는 상세 문서에 명시</text>
