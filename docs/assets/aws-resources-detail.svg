<text x="102" y="981" fill="#82d8c4" font-size="21" font-weight="650">② NGINX Ingress × 2 → Frontend / Spring Cloud Gateway</text>
<text x="102" y="1008" fill="#c2d4e4" font-size="17" font-weight="400">TLS 종료: cert-manager Secret · /member-service /product-service /ordering-service</text>
