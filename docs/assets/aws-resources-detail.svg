<text x="102" y="1191" fill="#c6b0f0" font-size="21" font-weight="650">④ DB Subnet Group → RDS 인스턴스 1대 (Single-AZ)</text>
<text x="102" y="1218" fill="#c2d4e4" font-size="17" font-weight="400">동일 Private 서브넷 쌍을 사용 · AZ는 코드에서 고정하지 않음 · SG: Private CIDR → 3306</text>
<text x="84" y="1280" fill="#c2d4e4" font-size="16" font-weight="400">클러스터 도구: Argo CD · LB Controller · cert-manager · Cluster Autoscaler · Metrics Server</text>
