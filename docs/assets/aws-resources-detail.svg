<text x="84" y="878" fill="#c2d4e4" font-size="17" font-weight="400">Managed Node Group · 두 Private 서브넷</text>
<text x="624" y="878" fill="#c2d4e4" font-size="17" font-weight="400">t3.medium · desired 3 / min 2 / max 6</text>
<text x="84" y="905" fill="#c2d4e4" font-size="16" font-weight="400">EC2 / ASG는 Managed Node Group이 생성</text>
