<text x="102" y="1086" fill="#82d8c4" font-size="21" font-weight="650">③ Member · Product · Ordering → RDS MySQL</text>
<text x="102" y="1113" fill="#c2d4e4" font-size="17" font-weight="400">Service DNS로 내부 통신 · HPA: 서비스별 min 1 / max 5 · CPU 목표 70%</text>
