apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigateway-depl
  namespace: soldesk
spec:
  selector:
    matchLabels:
      app: apigateway
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: apigateway
    spec:
      containers:
      - name: apigateway-container
        image: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com/sales-mall-dev-apigateway:ac927f0c15000a1b4f534eeff0b62c4a5a2e27b8-39202974134-1
        ports:
        - containerPort: 8080

        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_SECRET_KEY

        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
 
---
apiVersion: v1
kind: Service
metadata:
  name: apigateway-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector: 
    app: apigateway