apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-depl
  namespace: soldesk
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com/sales-mall-dev-frontend:v1
        ports:
        - containerPort: 80
        resources:
          # HPA CPU 사용률 계산을 위한 리소스 요청값
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend
