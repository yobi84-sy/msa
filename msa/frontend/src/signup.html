<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 | adidas mall</title><link rel="stylesheet" href="/assets/style.css"></head><body data-page="signup"><div class="announcement">adidas mall <span>·</span> AWS EKS 학습 프로젝트</div>
<header class="header"><a class="brand" href="/" aria-label="adidas mall 홈"><img src="/assets/adidas-logo.png" alt="adidas" width="54" height="36"><span>adidas <small>mall</small></span></a>
<nav aria-label="주 메뉴"><a href="/#collection">전체 상품</a><a href="/orders.html" data-auth-only hidden>내 주문</a><a href="/admin.html" data-admin-only hidden>상품 관리</a></nav><div id="userBox" class="account"></div></header><main><section class="form-page"><p class="eyebrow">JOIN THE MOVEMENT</p><h1>나만의 움직임을 시작하세요.</h1><form id="signupForm"><label>이름<input name="name" autocomplete="name" required maxlength="100"></label><label>아이디<input name="loginId" autocomplete="username" pattern="[A-Za-z0-9_-]{4,30}" required placeholder="영문·숫자·_·- 4~30자"></label><label>닉네임<input name="nickname" required maxlength="50"></label><label for="emailLocal">이메일</label><div class="email-row"><input id="emailLocal" required aria-label="이메일 아이디" pattern="[^@\s]+"><span>@</span><input id="emailDomain" required aria-label="이메일 도메인" placeholder="직접 입력"><select id="domainSelect" aria-label="도메인 선택"><option value="">직접 입력</option><option>gmail.com</option><option>naver.com</option><option>daum.net</option><option>outlook.com</option></select></div><label>비밀번호<input name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></label><p class="field-hint">12자 이상, 숫자와 특수문자 포함 · UTF-8 72바이트 이하</p><label>비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" required></label><button class="button" type="submit">회원가입 <span>→</span></button><p id="formMessage" role="status"></p></form><a class="text-link" href="/login.html">이미 계정이 있나요? 로그인 →</a></section></main><footer><a class="brand" href="/">adidas <small>mall</small></a><p>스포츠에서 시작되는 새로운 일상.</p><p class="muted">비상업적 학습·배포 실습용 프로젝트 · 결제 및 배송 서비스는 제공하지 않습니다.</p></footer><script src="/runtime/config.js"></script><script src="/assets/app.js" defer></script></body></html>
