    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "yobi-alert-rules",
        "namespace": "monitoring"
      },
      "data": {
        "rules.yml": "{\"groups\": [{\"name\": \"yobi-operational\", \"rules\": [{\"alert\": \"StorefrontUnavailable\", \"expr\": \"probe_success{job=\\\"yobi-public-https\\\"} == 0\", \"for\": \"3m\", \"labels\": {\"severity\": \"critical\"}, \"annotations\": {\"summary\": \"Shopping site or product API unavailable\"}}, {\"alert\": \"StorefrontProbeMissing\", \"expr\": \"absent(probe_success{job=\\\"yobi-public-https\\\"})\", \"for\": \"3m\", \"labels\": {\"severity\": \"critical\"}, \"annotations\": {\"summary\": \"HTTPS monitoring has no samples\"}}, {\"alert\": \"AppHasNoReadyReplicas\", \"expr\": \"kube_deployment_status_replicas_available{namespace=\\\"soldesk\\\",deployment=~\\\"(apigateway|member|product|ordering|frontend)-depl\\\"} == 0\", \"for\": \"2m\", \"labels\": {\"severity\": \"critical\"}, \"annotations\": {\"summary\": \"Application has no ready replicas\"}}, {\"alert\": \"PodRestarting\", \"expr\": \"sum by(namespace,pod)(increase(kube_pod_container_status_restarts_total{namespace=~\\\"soldesk|monitoring\\\"}[10m])) >= 3\", \"for\": \"1m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Container restarted at least three times in ten minutes\"}}, {\"alert\": \"NodeNotReady\", \"expr\": \"kube_node_status_condition{condition=\\\"Ready\\\",status=\\\"true\\\"} == 0\", \"for\": \"3m\", \"labels\": {\"severity\": \"critical\"}, \"annotations\": {\"summary\": \"Kubernetes node is not Ready\"}}, {\"alert\": \"NodeMemoryHigh\", \"expr\": \"1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9\", \"for\": \"5m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Node memory exceeds ninety percent\"}}, {\"alert\": \"ArgoSyncFailed\", \"expr\": \"kube_customresource_application_info{name=~\\\"msa-root|yobi-v1-msa|msa-monitoring\\\",sync!=\\\"Synced\\\"} == 1\", \"for\": \"5m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Argo application is not synced\"}}, {\"alert\": \"ArgoAppUnhealthy\", \"expr\": \"kube_customresource_application_info{name=~\\\"msa-root|yobi-v1-msa|msa-monitoring\\\",health=~\\\"Degraded|Missing|Unknown|Progressing\\\"} == 1\", \"for\": \"5m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Argo application is unhealthy\"}}, {\"alert\": \"HpaAtMaximum\", \"expr\": \"kube_horizontalpodautoscaler_status_desired_replicas{namespace=\\\"soldesk\\\"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=\\\"soldesk\\\"}\", \"for\": \"5m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"HPA has reached its configured maximum\"}}, {\"alert\": \"NodeCapacityAtMaximum\", \"expr\": \"count(kube_node_labels{label_eks_amazonaws_com_nodegroup=\\\"sales-mall-dev-nodegroup\\\"}) >= 6\", \"for\": \"5m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Node group has reached the reviewed node maximum\"}}, {\"alert\": \"StateMetricsUnavailable\", \"expr\": \"up{job=\\\"yobi-kube-state\\\"} == 0\", \"for\": \"3m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Kubernetes state collector unavailable\"}}, {\"alert\": \"OrderNotificationDeliveryFailing\", \"expr\": \"sum(increase(order_notification_events_total{result=\\\"failed\\\"}[10m])) > 0\", \"for\": \"1m\", \"labels\": {\"severity\": \"warning\"}, \"annotations\": {\"summary\": \"Order notification delivery failed; inspect outbox\"}}]}]}"
      }
