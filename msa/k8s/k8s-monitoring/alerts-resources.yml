      },
      "data": {
        "custom.yml": "{\"kind\": \"CustomResourceStateMetrics\", \"spec\": {\"resources\": [{\"groupVersionKind\": {\"group\": \"argoproj.io\", \"version\": \"v1alpha1\", \"kind\": \"Application\"}, \"labelsFromPath\": {\"name\": [\"metadata\", \"name\"]}, \"metrics\": [{\"name\": \"application_info\", \"help\": \"Argo application health and sync state\", \"each\": {\"type\": \"Info\", \"info\": {\"labelsFromPath\": {\"health\": [\"status\", \"health\", \"status\"], \"sync\": [\"status\", \"sync\", \"status\"]}}}}]}]}}"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "yobi-kube-state",
        "namespace": "monitoring"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "yobi-kube-state"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "yobi-kube-state"
            },
            "annotations": {
              "yobi.dev/notification-config-sha256": "a2195383eedca1d7c6077354cb96d82f6ca1b81228a8e416088aa24103119aba"
            }
          },
          "spec": {
            "serviceAccountName": "yobi-kube-state",
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65534,
              "fsGroup": 65534
            },
            "containers": [
              {
                "name": "yobi-kube-state",
                "image": "registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0",
                "args": [
                  "--resources=nodes,pods,deployments,replicasets,statefulsets,daemonsets,horizontalpodautoscalers",
                  "--metric-labels-allowlist=nodes=[eks.amazonaws.com/nodegroup]",
                  "--custom-resource-state-config-file=/config/custom.yml"
                ],
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "25m",
                    "memory": "48Mi"
                  },
                  "limits": {
                    "cpu": "200m",
                    "memory": "192Mi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/metrics",
                    "port": 8080
                  },
                  "initialDelaySeconds": 5,
                  "periodSeconds": 10
                },
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/config",
                    "readOnly": true
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "yobi-kube-state-config"
                }
              }
            ]
          }
        }
      }
    },
