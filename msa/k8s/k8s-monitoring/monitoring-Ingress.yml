# [Grafana HTTPS] Public Grafana password-protected; Prometheus remains cluster-internal
# TLS is managed by monitoring-https.yml Certificate only; avoid ingress-shim duplicate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - grafana.sy84.store
    secretName: monitoring-sy84-store-tls
  rules:
  - host: grafana.sy84.store
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
