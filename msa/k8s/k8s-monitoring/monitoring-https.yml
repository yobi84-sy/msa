# [DNS-01 cert-manager] issuer matches Terraform-managed letsencrypt-prod
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-sy84-store-tls
  namespace: monitoring
spec:
  secretName: monitoring-sy84-store-tls
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - grafana.sy84.store
