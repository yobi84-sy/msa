# monitoring-https.yml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-sy84-store-tls
  namespace: monitoring

spec:
  secretName: monitoring-sy84-store-tls

  duration: 2160h
  renewBefore: 360h

  issuerRef:
    name: my-issuer
    kind: ClusterIssuer

  dnsNames:
    - prometheus.sy84.store
    - grafana.sy84.store