{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "prometheus-config",
    "namespace": "monitoring"
  },
  "data": {
    "prometheus.yml": "global:\n  scrape_interval: 30s\nscrape_configs:\n  # [\ub178\ub4dc \uba54\ud2b8\ub9ad] node-exporter Pod IP:9100 \uc9c1\uc811 \uc2a4\ud06c\ub808\uc774\ud504\n  # hostNetwork \uc5c6\uc774 \ubaa8\ub2c8\ud130\ub9c1 Pod \ud1b5\uc2e0\ub9cc \uc0ac\uc6a9; \ub178\ub4dc \ubcf4\uc548\uadf8\ub8f9 9100 \uc624\ud508 \ubd88\ud544\uc694\n  - job_name: node-exporter\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names: [monitoring]\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        action: keep\n        regex: node-exporter\n      - source_labels: [__meta_kubernetes_pod_container_port_number]\n        action: keep\n        regex: '9100'\n      - source_labels: [__meta_kubernetes_pod_node_name]\n        target_label: node\n  # [\ucee8\ud14c\uc774\ub108 \uba54\ud2b8\ub9ad] cAdvisor \uc9c0\ud45c\ub85c Pod/\ucee8\ud14c\uc774\ub108 CPU\u00b7\uba54\ubaa8\ub9ac \ub300\uc2dc\ubcf4\ub4dc\ub97c \uad6c\uc131\n  # kubelet\uc5d0 \uc678\ubd80 \uc9c1\uc811 \uc811\uadfc\ud558\uc9c0 \uc54a\uace0 Kubernetes API Server \ud504\ub85d\uc2dc \uacbd\uc720\n  # ServiceAccount \ud1a0\ud070\uacfc \ud074\ub7ec\uc2a4\ud130 CA\ub97c \uc0ac\uc6a9\ud574 TLS \uc778\uc99d (RBAC\uc758 nodes/proxy \ud544\uc694)\n  # kube-state-metrics\ub294 \ucd94\uac00\ud558\uc9c0 \uc54a\uc74c: \uc774 \uad6c\uc131\ub9cc\uc73c\ub85c \ubaa8\ub4e0 \uc0c1\ud0dc \uc9c0\ud45c\uac00 \uc81c\uacf5\ub418\uc9c0\ub294 \uc54a\uc74c\n  - job_name: kubernetes-cadvisor\n    scheme: https\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    kubernetes_sd_configs:\n      - role: node\n    relabel_configs:\n      - target_label: __address__\n        replacement: kubernetes.default.svc:443\n      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n        target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n\n  - job_name: yobi-kube-state\n    static_configs:\n      - targets: [yobi-kube-state.monitoring.svc:8080]\n  - job_name: yobi-order-notifications\n    metrics_path: /actuator/prometheus\n    static_configs:\n      - targets: [ordering-service.soldesk.svc:80]\n  - job_name: yobi-public-https\n    scrape_interval: 60s\n    metrics_path: /probe\n    params:\n      module: [https_2xx]\n    static_configs:\n      - targets: [https://server.sy84.store/, https://server.sy84.store/product-service/product/list]\n    relabel_configs:\n      - source_labels: [__address__]\n        target_label: __param_target\n      - source_labels: [__param_target]\n        target_label: instance\n      - target_label: __address__\n        replacement: yobi-blackbox.monitoring.svc:9115\nalerting:\n  alertmanagers:\n    - static_configs:\n        - targets: [yobi-alertmanager.monitoring.svc:9093]\nrule_files: [/etc/yobi-alerts/rules.yml]\n"
  }
}