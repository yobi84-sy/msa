{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "prometheus",
        "namespace": "monitoring"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "prometheus"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "prometheus"
            },
            "annotations": {
              "yobi.dev/notification-config-sha256": "5bcb822176d664e30348e15eda9f9c87a8ad6f339aa0526eb996d48c42c38ac4"
            }
          },
          "spec": {
            "containers": [
              {
                "args": [
                  "--config.file=/etc/prometheus/prometheus.yml"
                ],
                "image": "prom/prometheus:v3.2.1",
                "name": "prometheus",
                "ports": [
                  {
                    "containerPort": 9090
                  }
                ],
                "resources": {
                  "limits": {
                    "cpu": "1",
                    "memory": "500Mi"
                  },
                  "requests": {
                    "cpu": "0.1",
                    "memory": "128Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "mountPath": "/etc/prometheus",
                    "name": "config-volume"
                  },
                  {
                    "name": "yobi-alert-rules",
                    "mountPath": "/etc/yobi-alerts",
                    "readOnly": true
                  }
                ]
              }
            ],
            "serviceAccountName": "prometheus",
            "volumes": [
              {
                "configMap": {
                  "name": "prometheus-config"
                },
                "name": "config-volume"
              },
              {
                "name": "yobi-alert-rules",
                "configMap": {
                  "name": "yobi-alert-rules"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "prometheus-service",
        "namespace": "monitoring"
      },
      "spec": {
        "ports": [
          {
            "port": 9090,
            "targetPort": 9090
          }
        ],
        "selector": {
          "app": "prometheus"
        }
      }
    }
  ]
}