apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-backend-ingress
  namespace: soldesk
  annotations:
    # F5 NGINX - 업로드 최대 20MB
    nginx.org/client-max-body-size: "20m"
    # HTTP → HTTPS 리다이렉트 시 요청 메서드 유지
    nginx.org/http-redirect-code: "308"
spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - "server.sy84.store"
    secretName: server-sy84-store-tls

  rules:
  - host: server.sy84.store
    http:
      paths:
      - path: /member-service
        pathType: Prefix
        backend:
          service:
            name: apigateway-service
            port:
              number: 80

      - path: /product-service
        pathType: Prefix
        backend:
          service:
            name: apigateway-service
            port:
              number: 80

      - path: /ordering-service
        pathType: Prefix
        backend:
          service:
            name: apigateway-service
            port:
              number: 80

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
