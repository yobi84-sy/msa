apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-depl
  namespace: soldesk
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  selector:
    matchLabels:
      app: ordering 
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
      labels:
        app: ordering 
    spec:
      serviceAccountName: order-notifications
      containers:
      - name: ordering-container
        image: 021158485482.dkr.ecr.ap-northeast-2.amazonaws.com/sales-mall-dev-ordering:12923fe41a13ceefc908b2ab44ec4b3f60a62996-39137464044-1
        ports:
        - containerPort: 8080
        resources:
        # 컨테이너가 사용할수 있는 리소스의 최대치
          limits:
            cpu: "1"
            memory: "500Mi"
        # 컨테이너가 시작될떄 보장받아야 하는 최소 자원
          requests:
            cpu: "0.5"
            memory: "250Mi"
        envFrom:
        - configMapRef:
            name: order-notifications
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-secrets
              key: JWT_SECRET_KEY
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_HOST
        - name: DB_PW
          valueFrom:
            secretKeyRef:
              name: my-app-secrets
              key: DB_PW
        # 컨테이너 상태 확인 
        readinessProbe:
          httpGet:
            # healthcheck 경로
            path: /health
            port: 8080
          # 컨테이너 시작 후 지연
          initialDelaySeconds: 10
          # 확인 반복 주기
          periodSeconds: 10

--- 
apiVersion: v1
kind: Service
metadata:
  name: ordering-service
  namespace: soldesk
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: ordering