spring:
  config:
    activate:
      on-profile: prod
  application:
    name: ordering-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:3306/ordermsa?useSSL=false&allowPublicKeyRetrieval=true
    username: admin
    password: ${DB_PW}
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    show_sql: true

jwt:
  secretKey: ${JWT_SECRET_KEY}

order:
  alerts:
    enabled: ${ORDER_ALERTS_ENABLED:false}
    dispatch-enabled: ${ORDER_ALERTS_ENABLED:false}
    email-topic: ${ORDER_ALERT_EMAIL_TOPIC_ARN:}
    sms-topic: ${ORDER_ALERT_SMS_TOPIC_ARN:}
    sms-daily-limit: ${ORDER_ALERT_SMS_DAILY_LIMIT:10}
