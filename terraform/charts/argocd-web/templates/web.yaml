apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-sy84-store-tls
spec:
  secretName: argocd-sy84-store-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - argocd.sy84.store
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-web
  annotations:
    nginx.org/ssl-services: argocd-server
    nginx.org/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [argocd.sy84.store]
      secretName: argocd-sy84-store-tls
  rules:
    - host: argocd.sy84.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
